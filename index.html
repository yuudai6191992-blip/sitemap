<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="復建調査設計株式会社の保有技術を、まちと自然の風景マップ上から直感的に探せる技術マップです。">
  <title>技術マップ | 復建調査設計株式会社</title>

  <!-- 埋め込みSVGファビコン（外部ファイル不要でconsoleの404も回避） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231466b8'/%3E%3Cpath d='M8 22V10h3.2l4.8 7 4.8-7H24v12h-3v-7l-4 5.8L13 15v7z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- スタイルシート -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       ヘッダー：タイトル・検索ボックス・カテゴリフィルタ
  ============================================================ -->
  <header class="site-header">
    <div class="container header-inner">

      <!-- サイトタイトル -->
      <div class="site-branding">
        <p class="company-name">復建調査設計株式会社</p>
        <h1 class="site-title">技術マップ</h1>
        <p class="site-lead">まちと自然の風景から、保有技術を直感的に探せます。</p>
      </div>

      <!-- 検索ボックス（全文検索） -->
      <div class="search-box">
        <label for="search-input" class="visually-hidden">技術を検索</label>
        <span class="search-box__icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-box__input"
          placeholder="技術名・キーワードで検索（例：AI、点検、防災）"
          autocomplete="off"
          aria-describedby="result-count">
        <button type="button" id="search-clear" class="search-box__clear" aria-label="検索条件をクリア" hidden>×</button>
      </div>

    </div>

    <!-- カテゴリフィルタ（複数選択可能） -->
    <nav class="category-filter" aria-label="カテゴリで絞り込み">
      <div class="container">
        <div class="category-filter__head">
          <span class="category-filter__title">カテゴリで絞り込み（複数選択可）</span>
          <button type="button" id="filter-reset" class="category-filter__reset">条件をリセット</button>
        </div>
        <!-- カテゴリチップはJavaScriptで動的生成 -->
        <div id="category-list" class="category-filter__list" role="group" aria-label="カテゴリ一覧"></div>
      </div>
    </nav>
  </header>

  <!-- ============================================================
       メインコンテンツ
  ============================================================ -->
  <main class="container main-content">

    <!-- 操作バー：ビュー切替・パンくず・件数・ソート -->
    <div class="toolbar">
      <!-- 表示切替（マップ／一覧） -->
      <div class="view-toggle" role="tablist" aria-label="表示の切り替え">
        <button type="button" id="view-map" class="view-toggle__btn is-active" role="tab" aria-selected="true">
          <span aria-hidden="true">🗺️</span> マップ表示
        </button>
        <button type="button" id="view-list" class="view-toggle__btn" role="tab" aria-selected="false">
          <span aria-hidden="true">☰</span> 一覧表示
        </button>
      </div>

      <!-- パンくず／件数 -->
      <div class="toolbar__status">
        <nav class="breadcrumb" aria-label="現在の表示条件">
          <ol id="breadcrumb" class="breadcrumb__list"></ol>
        </nav>
        <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
      </div>

      <!-- ソート選択（一覧表示のみ有効） -->
      <div class="toolbar__sort" id="sort-wrap">
        <label for="sort-select" class="toolbar__sort-label">並び替え</label>
        <select id="sort-select" class="toolbar__sort-select">
          <option value="name">名称順</option>
          <option value="category">カテゴリ順</option>
          <option value="newest">新着順</option>
        </select>
      </div>
    </div>

    <!-- ローディング表示 -->
    <div id="loading" class="loading" role="status" aria-live="polite">
      <span class="loading__spinner" aria-hidden="true"></span>
      <span>技術データを読み込んでいます…</span>
    </div>

    <!-- No Data 表示 -->
    <div id="no-data" class="no-data" hidden>
      <p class="no-data__icon" aria-hidden="true">🗂️</p>
      <p class="no-data__title">該当する技術が見つかりませんでした</p>
      <p class="no-data__hint">検索条件やカテゴリを変更してお試しください。</p>
      <button type="button" id="no-data-reset" class="btn btn--primary">条件をリセット</button>
    </div>

    <!-- ========================================================
         ① マップ表示（ビジュアル・3D風景）
         SVGで描いた風景の上に、技術ピンとゾーンラベルを重ねる
    ======================================================== -->
    <section id="map-view" class="map-view" aria-label="技術マップ（風景表示）">
      <p class="map-view__hint">
        <span aria-hidden="true">👆</span>
        風景の上のアイコンをクリックすると技術の詳細が開きます。上部のゾーンで絞り込めます。
      </p>

      <!-- 横スクロール可能なステージ（狭い画面向け） -->
      <div class="map-scroll">
        <div class="map-stage" id="map-stage">

          <!-- 背景の風景イラスト（インラインSVG） -->
          <svg class="map-scene" viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid slice"
               role="img" aria-label="山から河川・都市・海へと続く風景イラスト">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#cdeafc"/>
                <stop offset="1" stop-color="#eaf6ff"/>
              </linearGradient>
              <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#a5d66f"/>
                <stop offset="1" stop-color="#7cc250"/>
              </linearGradient>
              <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6cc6e6"/>
                <stop offset="1" stop-color="#2f9fd4"/>
              </linearGradient>
              <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8fd3f0"/>
                <stop offset="1" stop-color="#49ade0"/>
              </linearGradient>
              <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#9aa7d6"/>
                <stop offset="1" stop-color="#6f7fb8"/>
              </linearGradient>
              <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#b07a43"/>
                <stop offset="1" stop-color="#8a5a2b"/>
              </linearGradient>
            </defs>

            <!-- 空 -->
            <rect x="0" y="0" width="1200" height="680" fill="url(#sky)"/>

            <!-- 太陽（海の上・右上） -->
            <circle cx="1090" cy="88" r="34" fill="#ffd34e"/>
            <g stroke="#ffd34e" stroke-width="5" stroke-linecap="round">
              <line x1="1090" y1="30" x2="1090" y2="44"/>
              <line x1="1150" y1="88" x2="1136" y2="88"/>
              <line x1="1030" y1="88" x2="1044" y2="88"/>
              <line x1="1132" y1="46" x2="1122" y2="56"/>
              <line x1="1048" y1="46" x2="1058" y2="56"/>
            </g>
            <!-- 雲 -->
            <g fill="#ffffff" opacity="0.92">
              <ellipse cx="210" cy="96" rx="46" ry="20"/>
              <ellipse cx="250" cy="104" rx="34" ry="16"/>
              <ellipse cx="880" cy="120" rx="46" ry="20"/>
              <ellipse cx="918" cy="128" rx="32" ry="15"/>
            </g>

            <!-- 地面（アイソメトリックな台地） -->
            <polygon points="0,360 720,300 1200,392 1200,680 0,680" fill="url(#ground)"/>
            <!-- 手前の土の断面（立体感） -->
            <polygon points="0,680 0,360 210,470 210,680" fill="url(#earth)"/>
            <polygon points="0,360 210,470 210,486 0,376" fill="#000000" opacity="0.06"/>

            <!-- 海（右手前） -->
            <polygon points="1200,392 900,470 820,680 1200,680" fill="url(#ocean)"/>
            <g stroke="#ffffff" stroke-width="4" opacity="0.5" stroke-linecap="round" fill="none">
              <path d="M980 520 q20 -12 40 0 t40 0"/>
              <path d="M1010 570 q20 -12 40 0 t40 0"/>
              <path d="M950 610 q20 -12 40 0 t40 0"/>
            </g>

            <!-- 山（左） -->
            <polygon points="20,362 175,150 330,362" fill="url(#mount)"/>
            <polygon points="120,240 175,150 232,240 205,262 145,262" fill="#ffffff"/>
            <polygon points="150,362 300,196 450,362" fill="#8290c4"/>
            <polygon points="252,262 300,196 350,262 322,282 280,282" fill="#ffffff"/>

            <!-- ダム（山あいの構造物） -->
            <path d="M300 300 q60 20 120 4 l0 40 q-60 16 -120 -4 z" fill="#cfd6dd"/>
            <path d="M300 300 q60 20 120 4" fill="none" stroke="#aeb7c0" stroke-width="3"/>

            <!-- 河川（山から海へ蛇行） -->
            <path d="M312 316
                     C 360 380, 320 430, 380 470
                     S 520 520, 620 556
                     S 800 596, 900 470
                     L 980 500
                     C 880 640, 700 600, 560 540
                     S 360 470, 300 372 Z"
                  fill="url(#river)" opacity="0.95"/>

            <!-- 道路（中央から都市へ） -->
            <path d="M470 690 C 520 600, 560 560, 660 520 S 840 470, 940 452"
                  fill="none" stroke="#c3ccd4" stroke-width="30" stroke-linecap="round"/>
            <path d="M470 690 C 520 600, 560 560, 660 520 S 840 470, 940 452"
                  fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 14"/>

            <!-- 都市のビル群（右） -->
            <g>
              <rect x="836" y="300" width="46" height="120" rx="4" fill="#5b7fb0"/>
              <rect x="890" y="266" width="52" height="154" rx="4" fill="#7a9ac6"/>
              <rect x="950" y="300" width="44" height="120" rx="4" fill="#4f6f9e"/>
              <rect x="1000" y="278" width="50" height="142" rx="4" fill="#8fabd2"/>
              <rect x="1058" y="312" width="42" height="108" rx="4" fill="#6486b5"/>
              <!-- 窓 -->
              <g fill="#dceafb" opacity="0.9">
                <rect x="846" y="316" width="8" height="10"/><rect x="864" y="316" width="8" height="10"/>
                <rect x="846" y="338" width="8" height="10"/><rect x="864" y="338" width="8" height="10"/>
                <rect x="900" y="284" width="9" height="11"/><rect x="922" y="284" width="9" height="11"/>
                <rect x="900" y="308" width="9" height="11"/><rect x="922" y="308" width="9" height="11"/>
                <rect x="1010" y="296" width="9" height="11"/><rect x="1030" y="296" width="9" height="11"/>
                <rect x="1010" y="320" width="9" height="11"/><rect x="1030" y="320" width="9" height="11"/>
              </g>
            </g>

            <!-- 樹木 -->
            <g>
              <g transform="translate(410,392)"><rect x="-3" y="10" width="6" height="14" fill="#8a5a2b"/><circle cx="0" cy="4" r="16" fill="#5fa544"/></g>
              <g transform="translate(470,420)"><rect x="-3" y="10" width="6" height="14" fill="#8a5a2b"/><circle cx="0" cy="4" r="14" fill="#68b24c"/></g>
              <g transform="translate(250,440)"><rect x="-3" y="10" width="6" height="14" fill="#8a5a2b"/><circle cx="0" cy="4" r="15" fill="#5fa544"/></g>
              <g transform="translate(760,470)"><rect x="-3" y="10" width="6" height="14" fill="#8a5a2b"/><circle cx="0" cy="4" r="14" fill="#68b24c"/></g>
            </g>

            <!-- 船（海） -->
            <g transform="translate(1040,560)">
              <path d="M-30 0 h60 l-10 16 h-40 z" fill="#e7edf2"/>
              <rect x="-12" y="-14" width="24" height="14" fill="#c0ccd6"/>
            </g>
          </svg>

          <!-- ゾーンラベル（風景上部に浮かぶ白いチップ）：JSで生成 -->
          <div class="map-zones" id="map-zones" role="group" aria-label="ゾーンで絞り込み"></div>

          <!-- 技術ピン：JSで生成 -->
          <div class="map-pins" id="map-pins"></div>

        </div>
      </div>
    </section>

    <!-- ========================================================
         ② 一覧表示（カードグリッド）
    ======================================================== -->
    <section id="list-view" class="card-grid" aria-label="技術一覧" hidden></section>

  </main>

  <!-- ============================================================
       詳細表示モーダル
  ============================================================ -->
  <div id="modal" class="modal" hidden>
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button type="button" class="modal__close" data-modal-close aria-label="詳細を閉じる">×</button>
      <div id="modal-body" class="modal__body"></div>
    </div>
  </div>

  <!-- ============================================================
       フッター
  ============================================================ -->
  <footer class="site-footer">
    <div class="container">
      <p class="site-footer__company">復建調査設計株式会社</p>
      <p class="site-footer__note">本ページに掲載の技術情報はサンプルデータです。</p>
      <p class="site-footer__copy">&copy; <span id="footer-year"></span> FUKKEN CO., LTD. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- ============================================================
       JavaScript（責務ごとに分割・クラス設計）
  ============================================================ -->
  <script src="js/filter.js"></script>
  <script src="js/search.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
