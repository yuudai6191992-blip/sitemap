<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="復建調査設計株式会社の保有技術を、まちと自然の風景マップ上から直感的に探せる技術マップです。">
  <title>技術マップ | 復建調査設計株式会社</title>

  <!-- 埋め込みSVGファビコン（外部ファイル不要でconsoleの404も回避） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231466b8'/%3E%3Cpath d='M8 22V10h3.2l4.8 7 4.8-7H24v12h-3v-7l-4 5.8L13 15v7z' fill='%23fff'/%3E%3C/svg%3E">

  <!-- スタイルシート -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       ヘッダー：タイトル・検索ボックス・カテゴリフィルタ
  ============================================================ -->
  <header class="site-header">
    <div class="container header-inner">

      <!-- サイトタイトル -->
      <div class="site-branding">
        <p class="company-name">復建調査設計株式会社</p>
        <h1 class="site-title">技術マップ</h1>
        <p class="site-lead">まちと自然の風景から、保有技術を直感的に探せます。</p>
      </div>

      <!-- 検索ボックス（全文検索） -->
      <div class="search-box">
        <label for="search-input" class="visually-hidden">技術を検索</label>
        <span class="search-box__icon" aria-hidden="true">🔍</span>
        <input
          type="search"
          id="search-input"
          class="search-box__input"
          placeholder="技術名・キーワードで検索（例：AI、点検、防災）"
          autocomplete="off"
          aria-describedby="result-count">
        <button type="button" id="search-clear" class="search-box__clear" aria-label="検索条件をクリア" hidden>×</button>
      </div>

    </div>

    <!-- カテゴリフィルタ（複数選択可能） -->
    <nav class="category-filter" aria-label="カテゴリで絞り込み">
      <div class="container">
        <div class="category-filter__head">
          <span class="category-filter__title">カテゴリで絞り込み（複数選択可）</span>
          <button type="button" id="filter-reset" class="category-filter__reset">条件をリセット</button>
        </div>
        <!-- カテゴリチップはJavaScriptで動的生成 -->
        <div id="category-list" class="category-filter__list" role="group" aria-label="カテゴリ一覧"></div>
      </div>
    </nav>
  </header>

  <!-- ============================================================
       メインコンテンツ
  ============================================================ -->
  <main class="container main-content">

    <!-- 操作バー：ビュー切替・パンくず・件数・ソート -->
    <div class="toolbar">
      <!-- 表示切替（マップ／一覧） -->
      <div class="view-toggle" role="tablist" aria-label="表示の切り替え">
        <button type="button" id="view-map" class="view-toggle__btn is-active" role="tab" aria-selected="true">
          <span aria-hidden="true">🗺️</span> マップ表示
        </button>
        <button type="button" id="view-list" class="view-toggle__btn" role="tab" aria-selected="false">
          <span aria-hidden="true">☰</span> 一覧表示
        </button>
      </div>

      <!-- パンくず／件数 -->
      <div class="toolbar__status">
        <nav class="breadcrumb" aria-label="現在の表示条件">
          <ol id="breadcrumb" class="breadcrumb__list"></ol>
        </nav>
        <p id="result-count" class="result-count" role="status" aria-live="polite"></p>
      </div>

      <!-- ソート選択（一覧表示のみ有効） -->
      <div class="toolbar__sort" id="sort-wrap">
        <label for="sort-select" class="toolbar__sort-label">並び替え</label>
        <select id="sort-select" class="toolbar__sort-select">
          <option value="name">名称順</option>
          <option value="category">カテゴリ順</option>
          <option value="newest">新着順</option>
        </select>
      </div>
    </div>

    <!-- ローディング表示 -->
    <div id="loading" class="loading" role="status" aria-live="polite">
      <span class="loading__spinner" aria-hidden="true"></span>
      <span>技術データを読み込んでいます…</span>
    </div>

    <!-- No Data 表示 -->
    <div id="no-data" class="no-data" hidden>
      <p class="no-data__icon" aria-hidden="true">🗂️</p>
      <p class="no-data__title">該当する技術が見つかりませんでした</p>
      <p class="no-data__hint">検索条件やカテゴリを変更してお試しください。</p>
      <button type="button" id="no-data-reset" class="btn btn--primary">条件をリセット</button>
    </div>

    <!-- ========================================================
         ① マップ表示（ビジュアル・3D風景）
         ・ドラッグで移動、ホイール／ピンチ／ボタンで拡大縮小
         ・SVGで描いた縮図の風景の上に、技術ピンを重ねる
    ======================================================== -->
    <section id="map-view" class="map-view" aria-label="技術マップ（風景表示）">
      <p class="map-view__hint">
        <span aria-hidden="true">👆</span>
        アイコンをクリックで詳細表示。ドラッグで移動、ホイール（スマホは2本指）で拡大・縮小できます。
      </p>

      <!-- ビューポート：この枠内でマップを移動・拡大縮小する -->
      <div class="map-viewport" id="map-viewport" tabindex="0"
           role="application"
           aria-label="技術マップ。矢印キーで移動、プラス・マイナスキーで拡大縮小できます。">

        <!-- 移動・拡大縮小の対象（JSでtransformを適用） -->
        <div class="map-stage" id="map-stage">

          <!-- 背景の風景イラスト（インラインSVG・都市／山／川／海の縮図） -->
          <svg class="map-scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet"
               role="img" aria-label="山・ダム・河川・公園のある都市・港と海を一望する風景イラスト">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#c7e7fb"/>
                <stop offset="1" stop-color="#eaf6ff"/>
              </linearGradient>
              <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#a9d972"/>
                <stop offset="1" stop-color="#7abd4e"/>
              </linearGradient>
              <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7fd0ea"/>
                <stop offset="1" stop-color="#2b93cc"/>
              </linearGradient>
              <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#93d8f2"/>
                <stop offset="1" stop-color="#48b0e2"/>
              </linearGradient>
              <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#9fabda"/>
                <stop offset="1" stop-color="#6b7cb6"/>
              </linearGradient>
              <linearGradient id="mount2" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#8b98cc"/>
                <stop offset="1" stop-color="#5d6da6"/>
              </linearGradient>
              <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#b98049"/>
                <stop offset="1" stop-color="#8a5a2b"/>
              </linearGradient>
              <!-- 市街地ブロック（建物が並ぶエリア）の下地 -->
              <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e9eef3"/>
                <stop offset="1" stop-color="#d7e0e8"/>
              </linearGradient>
            </defs>

            <!-- ===== 空・太陽・雲 ===== -->
            <rect x="0" y="0" width="1600" height="1000" fill="url(#sky)"/>
            <circle cx="1330" cy="110" r="38" fill="#ffd34e"/>
            <g stroke="#ffd34e" stroke-width="6" stroke-linecap="round">
              <line x1="1330" y1="44" x2="1330" y2="58"/>
              <line x1="1396" y1="110" x2="1382" y2="110"/>
              <line x1="1264" y1="110" x2="1278" y2="110"/>
              <line x1="1377" y1="63" x2="1367" y2="73"/>
              <line x1="1283" y1="63" x2="1293" y2="73"/>
            </g>
            <g fill="#ffffff" opacity="0.92">
              <ellipse cx="250" cy="92" rx="52" ry="22"/>
              <ellipse cx="296" cy="100" rx="38" ry="17"/>
              <ellipse cx="700" cy="70" rx="46" ry="20"/>
              <ellipse cx="740" cy="78" rx="32" ry="15"/>
              <ellipse cx="1080" cy="150" rx="42" ry="18"/>
            </g>
            <!-- 雨雲（左上・雨ゾーン） -->
            <g>
              <ellipse cx="150" cy="150" rx="58" ry="24" fill="#c6d3de"/>
              <ellipse cx="196" cy="158" rx="40" ry="18" fill="#d4dee7"/>
              <g stroke="#8fc9e8" stroke-width="5" stroke-linecap="round">
                <line x1="120" y1="180" x2="110" y2="204"/>
                <line x1="152" y1="182" x2="142" y2="208"/>
                <line x1="184" y1="180" x2="174" y2="204"/>
              </g>
            </g>

            <!-- ===== 陸地（大地） ===== -->
            <polygon points="0,470 560,330 1180,430 1600,560 1600,1000 0,1000" fill="url(#ground)"/>
            <!-- 手前の土の断面 -->
            <polygon points="0,1000 0,470 240,560 240,1000" fill="url(#earth)"/>
            <polygon points="0,470 240,560 240,578 0,488" fill="#000000" opacity="0.06"/>

            <!-- ===== 海（右側） ===== -->
            <polygon points="1600,560 1180,430 1120,1000 1600,1000" fill="url(#ocean)"/>
            <g stroke="#ffffff" stroke-width="5" opacity="0.45" stroke-linecap="round" fill="none">
              <path d="M1290 640 q22 -14 44 0 t44 0"/>
              <path d="M1360 720 q22 -14 44 0 t44 0"/>
              <path d="M1250 800 q22 -14 44 0 t44 0"/>
              <path d="M1380 880 q22 -14 44 0 t44 0"/>
            </g>

            <!-- ===== 山地（左奥） ===== -->
            <polygon points="30,478 210,190 390,478" fill="url(#mount)"/>
            <polygon points="146,300 210,190 276,300 244,326 178,326" fill="#ffffff"/>
            <polygon points="230,470 400,236 570,470" fill="url(#mount2)"/>
            <polygon points="344,320 400,236 458,320 428,344 374,344" fill="#ffffff"/>
            <polygon points="440,466 560,300 680,466" fill="#8290c4"/>
            <polygon points="516,368 560,300 606,368 582,386 540,386" fill="#ffffff"/>
            <!-- 森（山裾） -->
            <g>
              <g transform="translate(150,470)"><polygon points="0,-34 16,0 -16,0" fill="#4e9440"/><rect x="-3" y="0" width="6" height="10" fill="#7b5432"/></g>
              <g transform="translate(196,486)"><polygon points="0,-30 15,0 -15,0" fill="#57a247"/><rect x="-3" y="0" width="6" height="9" fill="#7b5432"/></g>
              <g transform="translate(300,492)"><polygon points="0,-32 15,0 -15,0" fill="#4e9440"/><rect x="-3" y="0" width="6" height="9" fill="#7b5432"/></g>
              <g transform="translate(360,510)"><polygon points="0,-28 14,0 -14,0" fill="#57a247"/><rect x="-3" y="0" width="6" height="9" fill="#7b5432"/></g>
            </g>

            <!-- ===== ダム（山あい） ===== -->
            <g>
              <path d="M392 430 q76 26 152 6 l0 52 q-76 20 -152 -6 z" fill="#d6dde3"/>
              <path d="M392 430 q76 26 152 6" fill="none" stroke="#aeb7c0" stroke-width="4"/>
              <rect x="452" y="452" width="30" height="34" rx="3" fill="#b9c3cb"/>
              <!-- 貯水 -->
              <path d="M392 424 q76 26 152 6 l0 -22 q-76 18 -152 -8 z" fill="#7cc7e8"/>
            </g>

            <!-- ===== 河川（山→都市→海へ蛇行） ===== -->
            <path d="M430 452
                     C 470 540, 430 590, 500 640
                     S 660 700, 800 740
                     S 1020 790, 1150 700
                     L 1230 742
                     C 1080 862, 860 800, 700 742
                     S 470 660, 400 496 Z"
                  fill="url(#river)" opacity="0.96"/>
            <!-- 河川敷の護岸 -->
            <path d="M430 452 C 470 540, 430 590, 500 640 S 660 700, 800 740 S 1020 790, 1150 700"
                  fill="none" stroke="#bfe6f7" stroke-width="4" opacity="0.8"/>

            <!-- ===== 道路網（都市の格子＋幹線） ===== -->
            <g stroke-linecap="round">
              <!-- 幹線道路：左手前から都市を貫き港へ -->
              <path id="mainroad" d="M180 1000 C 320 880, 460 820, 620 800 S 900 760, 1060 660 S 1180 600, 1260 590"
                    fill="none" stroke="#c9d2da" stroke-width="34"/>
              <path d="M180 1000 C 320 880, 460 820, 620 800 S 900 760, 1060 660 S 1180 600, 1260 590"
                    fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 18"/>

              <!-- 都市の格子道路（縦） -->
              <g stroke="#cdd6dd" stroke-width="14">
                <path d="M900 470 L 840 690" fill="none"/>
                <path d="M980 480 L 928 706" fill="none"/>
                <path d="M1060 492 L 1014 720" fill="none"/>
                <path d="M1140 506 L 1100 732" fill="none"/>
              </g>
              <!-- 都市の格子道路（横） -->
              <g stroke="#cdd6dd" stroke-width="14">
                <path d="M868 556 L 1180 592" fill="none"/>
                <path d="M852 626 L 1150 664" fill="none"/>
              </g>

              <!-- 郊外の道（山・公園方面） -->
              <path d="M470 640 C 560 620, 640 600, 720 560 S 830 520, 890 486"
                    fill="none" stroke="#cdd6dd" stroke-width="16"/>
              <path d="M300 720 C 380 700, 430 690, 500 676"
                    fill="none" stroke="#cdd6dd" stroke-width="14"/>
            </g>

            <!-- ===== 橋（河川を渡る幹線） ===== -->
            <g>
              <rect x="742" y="716" width="120" height="26" rx="4" fill="#e3e9ee" transform="rotate(-8 802 729)"/>
              <g stroke="#b9c3cb" stroke-width="5">
                <line x1="756" y1="742" x2="756" y2="766" transform="rotate(-8 802 729)"/>
                <line x1="846" y1="742" x2="846" y2="766" transform="rotate(-8 802 729)"/>
              </g>
              <!-- アーチ -->
              <path d="M748 716 q56 -34 112 0" fill="none" stroke="#dfe6ec" stroke-width="7" transform="rotate(-8 802 729)"/>
            </g>

            <!-- ===== 市街地ブロック（建物が密集するエリアの舗装下地） ===== -->
            <g opacity="0.75">
              <polygon points="880,470 1160,506 1108,724 838,686" fill="url(#block)"
                       stroke="#cbd5dd" stroke-width="2" stroke-linejoin="round"/>
            </g>

            <!-- ===== 都市：ビル群（高層＋中層でメリハリ） ===== -->
            <g>
              <!-- 後列（高層） -->
              <rect x="900" y="330" width="52" height="150" rx="4" fill="#6b8dbd"/>
              <rect x="960" y="286" width="58" height="196" rx="4" fill="#87a6cf"/>
              <rect x="1026" y="322" width="50" height="162" rx="4" fill="#5c7fb1"/>
              <rect x="1084" y="292" width="56" height="196" rx="4" fill="#7f9fca"/>
              <rect x="1148" y="336" width="48" height="156" rx="4" fill="#6789ba"/>
              <!-- ランドマークタワー -->
              <polygon points="1216,500 1236,300 1256,500" fill="#9fb8d8"/>
              <rect x="1229" y="270" width="14" height="34" fill="#c3d3e7"/>
              <circle cx="1236" cy="264" r="7" fill="#ffd34e"/>

              <!-- 前列（中層・カラフルに） -->
              <rect x="884" y="520" width="54" height="112" rx="4" fill="#8fb0d6"/>
              <rect x="946" y="540" width="50" height="104" rx="4" fill="#a8c3e0"/>
              <rect x="1004" y="524" width="56" height="122" rx="4" fill="#7a9dc9"/>
              <rect x="1068" y="546" width="50" height="108" rx="4" fill="#9bbadb"/>
              <rect x="1124" y="530" width="46" height="120" rx="4" fill="#86a8d0"/>

              <!-- 商業施設（低層・赤系アクセント） -->
              <rect x="856" y="646" width="76" height="52" rx="5" fill="#e6b7a8"/>
              <rect x="944" y="662" width="70" height="48" rx="5" fill="#efc9b4"/>

              <!-- 窓（後列・前列） -->
              <g fill="#dceafb" opacity="0.9">
                <rect x="910" y="348" width="9" height="12"/><rect x="930" y="348" width="9" height="12"/>
                <rect x="910" y="374" width="9" height="12"/><rect x="930" y="374" width="9" height="12"/>
                <rect x="910" y="400" width="9" height="12"/><rect x="930" y="400" width="9" height="12"/>
                <rect x="972" y="304" width="10" height="13"/><rect x="996" y="304" width="10" height="13"/>
                <rect x="972" y="332" width="10" height="13"/><rect x="996" y="332" width="10" height="13"/>
                <rect x="972" y="360" width="10" height="13"/><rect x="996" y="360" width="10" height="13"/>
                <rect x="1096" y="310" width="10" height="13"/><rect x="1120" y="310" width="10" height="13"/>
                <rect x="1096" y="338" width="10" height="13"/><rect x="1120" y="338" width="10" height="13"/>
                <rect x="1096" y="366" width="10" height="13"/><rect x="1120" y="366" width="10" height="13"/>
                <rect x="1016" y="542" width="10" height="12"/><rect x="1038" y="542" width="10" height="12"/>
                <rect x="1016" y="568" width="10" height="12"/><rect x="1038" y="568" width="10" height="12"/>
              </g>
            </g>

            <!-- ===== 公園（都市の緑地・池つき） ===== -->
            <g>
              <!-- 芝生 -->
              <ellipse cx="700" cy="640" rx="132" ry="72" fill="#8ccb5c"/>
              <ellipse cx="700" cy="640" rx="132" ry="72" fill="none" stroke="#76b74a" stroke-width="3"/>
              <!-- 園路 -->
              <path d="M596 664 q100 -54 208 -14" fill="none" stroke="#efe6cf" stroke-width="9"/>
              <!-- 池 -->
              <ellipse cx="736" cy="662" rx="44" ry="22" fill="#7cc7e8"/>
              <ellipse cx="736" cy="662" rx="44" ry="22" fill="none" stroke="#bfe6f7" stroke-width="3"/>
              <!-- 樹木 -->
              <g>
                <g transform="translate(636,610)"><rect x="-3" y="10" width="7" height="15" fill="#7b5432"/><circle cx="0" cy="2" r="18" fill="#5aa848"/></g>
                <g transform="translate(686,592)"><rect x="-3" y="9" width="6" height="14" fill="#7b5432"/><circle cx="0" cy="0" r="16" fill="#66b452"/></g>
                <g transform="translate(742,600)"><rect x="-3" y="9" width="6" height="14" fill="#7b5432"/><circle cx="0" cy="0" r="15" fill="#5aa848"/></g>
                <g transform="translate(792,626)"><rect x="-3" y="9" width="6" height="14" fill="#7b5432"/><circle cx="0" cy="0" r="17" fill="#66b452"/></g>
                <g transform="translate(620,668)"><rect x="-3" y="9" width="6" height="14" fill="#7b5432"/><circle cx="0" cy="0" r="14" fill="#5aa848"/></g>
              </g>
              <!-- 東屋 -->
              <g transform="translate(668,656)">
                <polygon points="0,-16 20,0 -20,0" fill="#d98b6a"/>
                <rect x="-14" y="0" width="4" height="14" fill="#b9c3cb"/>
                <rect x="10" y="0" width="4" height="14" fill="#b9c3cb"/>
              </g>
            </g>

            <!-- ===== 郊外の住宅・田畑（左〜中央） ===== -->
            <g>
              <!-- 田畑 -->
              <g opacity="0.95">
                <polygon points="300,760 420,742 442,790 320,810" fill="#c9dd8a"/>
                <polygon points="330,832 450,812 470,858 348,880" fill="#b6d477"/>
                <g stroke="#a8c96a" stroke-width="2">
                  <line x1="312" y1="768" x2="430" y2="750"/>
                  <line x1="316" y1="782" x2="434" y2="764"/>
                  <line x1="340" y1="842" x2="458" y2="822"/>
                  <line x1="344" y1="856" x2="462" y2="836"/>
                </g>
              </g>
              <!-- 住宅 -->
              <g>
                <g transform="translate(520,742)">
                  <rect x="-18" y="0" width="36" height="26" fill="#f5f1e8"/>
                  <polygon points="-22,0 0,-18 22,0" fill="#d98b6a"/>
                </g>
                <g transform="translate(576,772)">
                  <rect x="-16" y="0" width="32" height="24" fill="#f5f1e8"/>
                  <polygon points="-20,0 0,-16 20,0" fill="#7fb0d8"/>
                </g>
                <g transform="translate(492,806)">
                  <rect x="-16" y="0" width="32" height="24" fill="#f5f1e8"/>
                  <polygon points="-20,0 0,-16 20,0" fill="#d98b6a"/>
                </g>
              </g>
            </g>

            <!-- ===== 港・沿岸（右下） ===== -->
            <g>
              <!-- 埠頭 -->
              <polygon points="1128,742 1290,776 1268,846 1108,806" fill="#dfe5ea"
                       stroke="#c6d0d8" stroke-width="2" stroke-linejoin="round"/>
              <!-- コンテナ -->
              <g>
                <rect x="1150" y="764" width="34" height="20" rx="2" fill="#e0705f"/>
                <rect x="1190" y="772" width="34" height="20" rx="2" fill="#5f9fd0"/>
                <rect x="1230" y="780" width="34" height="20" rx="2" fill="#e8b45a"/>
                <rect x="1160" y="792" width="34" height="20" rx="2" fill="#69b06a"/>
                <rect x="1202" y="800" width="34" height="20" rx="2" fill="#e0705f"/>
              </g>
              <!-- クレーン -->
